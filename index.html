<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ScanSign Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://docs.opencv.org/4.8.0/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}body{background:#f5f5f7;height:100vh;display:flex;flex-direction:column}.top{height:56px;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.logo{font-weight:800;font-size:20px}.logo b{color:#007AFF}.main{flex:1;display:grid;grid-template-columns:340px 1fr 320px;overflow:hidden}.side{background:white;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}.card{background:#f5f5f7;border-radius:16px;padding:14px}.btn{width:100%;padding:12px;border-radius:12px;border:0;font-weight:600;font-size:14px;cursor:pointer;display:flex;justify-content:center;gap:6px}.btn-p{background:#007AFF;color:white}.btn-s{background:white;border:1px solid rgba(0,0,0,0.1)}.btn-g{background:rgba(0,0,0,0.05)}.canvasArea{background:#d1d1d6;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:20px;gap:12px}#mainCanvas{background:white;box-shadow:0 20px 60px rgba(0,0,0,0.25);border-radius:4px;max-width:100%;touch-action:none}#scanVideo{width:100%;border-radius:16px;background:black;display:none}#scanCanvas{display:none}.sigList{display:flex;gap:8px;overflow:auto}.sigChip{min-width:90px;height:60px;background:white;border-radius:10px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}.sigChip img{max-width:80%;max-height:80%}</style></head><body>
<div class="top"><div class="logo">Scan<b>Sign</b> PRO</div><div style="font-size:11px;background:#34C759;color:white;padding:4px 10px;border-radius:20px">● LIVE READY</div></div>
<div class="main"><div class="side">
<div class="card"><div style="font-weight:700;font-size:13px">📸 APPLE SCAN - AUTO CROP</div><button class="btn btn-p" onclick="startScanner()">▶️ Start Camera</button><video id="scanVideo" autoplay playsinline></video><canvas id="scanCanvas"></canvas><div id="scanControls" style="display:none;flex-direction:column;gap:8px;margin-top:10px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="btn btn-s" onclick="captureDoc()">📷 Capture</button><button class="btn btn-s" onclick="autoCrop()">✨ Auto-Crop</button><button class="btn btn-s" onclick="enhanceDoc()">🌟 Enhance</button><button class="btn btn-s" onclick="ocrDoc()">🔤 OCR</button></div><button class="btn btn-g" onclick="stopScanner()">Stop</button></div><input type="file" id="fileInput" accept="image/*" hidden><button class="btn btn-s" style="margin-top:8px" onclick="document.getElementById('fileInput').click()">Upload Document</button><div id="ocrResult" style="margin-top:8px;font-size:11px;background:white;padding:8px;border-radius:8px;display:none"></div></div>
<div class="card"><div style="font-weight:700;font-size:13px">✒️ SIGNATURES</div><canvas id="sigPad" style="width:100%;height:100px;background:white;border-radius:10px;border:1px solid #ddd;touch-action:none"></canvas><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-g" style="flex:1" onclick="clearPad()">Clear</button><button class="btn btn-p" style="flex:1" onclick="saveSig()">+ Add</button></div><input type="file" id="sigFile" accept="image/*" hidden><button class="btn btn-s" style="margin-top:8px" onclick="document.getElementById('sigFile').click()">Upload Signature</button><div class="sigList" id="sigList" style="margin-top:10px"></div></div>
<div class="card"><div style="font-weight:700;font-size:13px">🔴 STAMPS</div><input id="stampTxt" placeholder="APPROVED" style="width:100%;padding:8px;border-radius:8px;border:1px solid #ddd"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><button class="btn btn-s" onclick="makeStamp('circle')">Circle Seal</button><button class="btn btn-s" onclick="makeStamp('rect')">Rect Stamp</button></div><input type="file" id="stampFile" accept="image/*" hidden><button class="btn btn-s" style="margin-top:6px" onclick="document.getElementById('stampFile').click()">Upload Stamp</button><div class="sigList" id="stampList" style="margin-top:10px"></div></div>
</div>
<div class="canvasArea"><div style="display:flex;gap:8px"><button class="btn btn-s" style="width:auto;padding:6px 12px" onclick="clearAll()">Clear</button><button class="btn btn-s" style="width:auto;padding:6px 12px" onclick="undo()">Undo</button><button class="btn btn-s" style="width:auto;padding:6px 12px" onclick="deleteSel()">Delete</button></div><canvas id="mainCanvas" width="800" height="1120"></canvas></div>
<div class="side"><div class="card"><div style="font-weight:700;font-size:13px">EXPORT</div><button class="btn btn-p" onclick="exportPDF()">📄 Export PDF</button><button class="btn btn-s" style="margin-top:8px" onclick="exportPNG()">🖼️ Export PNG</button><button class="btn btn-s" style="margin-top:8px" onclick="exportJPG()">Export JPG</button></div><div class="card" style="background:linear-gradient(135deg,#007AFF,#5856D6);color:white"><div style="font-weight:700;font-size:12px">🌐 DEPLOY TO LIVE LINK</div><div style="font-size:11px;margin-top:6px;line-height:1.5;opacity:0.9">1. Go to vercel.com/new<br>2. Upload index.html + vercel.json<br>3. Click Deploy → Live!</div></div></div></div>
<script>
const mainCanvas=document.getElementById('mainCanvas'),mctx=mainCanvas.getContext('2d');let docImg=null,objs=[],sel=null,hist=[],stream=null,isDrag=false,dragOff={x:0,y:0};
function saveH(){hist.push(JSON.stringify(objs.map(o=>({x:o.x,y:o.y,w:o.w,h:o.h,scale:o.scale,rot:o.rotation,op:o.opacity,data:o.data}))));if(hist.length>30)hist.shift();}
function undo(){if(!hist.length)return;const arr=JSON.parse(hist.pop());objs=arr.map(o=>{const img=new Image();img.src=o.data;return{img,data:o.data,x:o.x,y:o.y,w:o.w,h:o.h,scale:o.scale,rotation:o.rot,opacity:o.op};});sel=null;render();}
function render(){mctx.clearRect(0,0,mainCanvas.width,mainCanvas.height);mctx.fillStyle='white';mctx.fillRect(0,0,mainCanvas.width,mainCanvas.height);if(docImg)mctx.drawImage(docImg,0,0,mainCanvas.width,mainCanvas.height);objs.forEach((o,i)=>{mctx.save();mctx.globalAlpha=o.opacity;mctx.translate(o.x,o.y);mctx.rotate(o.rotation*Math.PI/180);mctx.scale(o.scale,o.scale);mctx.drawImage(o.img,-o.w/2,-o.h/2,o.w,o.h);mctx.restore();if(sel===i){mctx.save();mctx.strokeStyle='#007AFF';mctx.setLineDash([6,4]);mctx.lineWidth=2;mctx.translate(o.x,o.y);mctx.rotate(o.rotation*Math.PI/180);const bw=o.w*o.scale,bh=o.h*o.scale;mctx.strokeRect(-bw/2-4,-bh/2-4,bw+8,bh+8);mctx.restore();}});}
function fitImg(img){const r=Math.min(800/img.width,1120/img.height,1);mainCanvas.width=img.width*r;mainCanvas.height=img.height*r;}
async function startScanner(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=document.getElementById('scanVideo');v.srcObject=stream;v.style.display='block';document.getElementById('scanControls').style.display='flex';}catch(e){alert(e.message);}}
function stopScanner(){if(stream)stream.getTracks().forEach(t=>t.stop());document.getElementById('scanVideo').style.display='none';document.getElementById('scanControls').style.display='none';}
function captureDoc(){const v=document.getElementById('scanVideo'),c=document.getElementById('scanCanvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const img=new Image();img.onload=()=>{docImg=img;fitImg(img);render();};img.src=c.toDataURL();}
function autoCrop(){if(!docImg){alert('Capture first');return;}try{const src=cv.imread(mainCanvas);const gray=new cv.Mat();cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);const blur=new cv.Mat();cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);const edges=new cv.Mat();cv.Canny(blur,edges,75,200);const contours=new cv.MatVector(),hierarchy=new cv.Mat();cv.findContours(edges,contours,hierarchy,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);let maxA=0,b=null;for(let i=0;i<contours.size();i++){const cnt=contours.get(i);const a=cv.contourArea(cnt);if(a>maxA){maxA=a;b=cnt;}}if(b){const rect=cv.boundingRect(b);mctx.strokeStyle='#00FF88';mctx.lineWidth=3;mctx.strokeRect(rect.x,rect.y,rect.width,rect.height);setTimeout(()=>render(),1000);}src.delete();gray.delete();blur.delete();edges.delete();contours.delete();hierarchy.delete();}catch(e){alert('OpenCV loading, try again');}}
function enhanceDoc(){if(!docImg)return;const tmp=document.createElement('canvas');tmp.width=mainCanvas.width;tmp.height=mainCanvas.height;const t=tmp.getContext('2d');t.drawImage(mainCanvas,0,0);const id=t.getImageData(0,0,tmp.width,tmp.height);for(let i=0;i<id.data.length;i+=4){const b=id.data[i]*0.3+id.data[i+1]*0.59+id.data[i+2]*0.11;const v=b>180?255:b<80?0:(b-80)*2;id.data[i]=id.data[i+1]=id.data[i+2]=v;}t.putImageData(id,0,0);const img=new Image();img.onload=()=>{docImg=img;render();};img.src=tmp.toDataURL();}
async function ocrDoc(){const res=document.getElementById('ocrResult');res.style.display='block';res.textContent='OCR scanning...';const data=mainCanvas.toDataURL();const r=await Tesseract.recognize(data,'eng');res.textContent=r.data.text.substring(0,500);}
document.getElementById('fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=ev=>{const img=new Image();img.onload=()=>{docImg=img;fitImg(img);render();};img.src=ev.target.result;};fr.readAsDataURL(f);});
const pad=document.getElementById('sigPad'),pctx=pad.getContext('2d');function resizePad(){const r=pad.getBoundingClientRect();pad.width=r.width*2;pad.height=100*2;pctx.scale(2,2);pctx.lineCap='round';pctx.lineJoin='round';pctx.lineWidth=2.5;pctx.strokeStyle='#111';}resizePad();let drawing=false;pad.addEventListener('pointerdown',e=>{drawing=true;pctx.beginPath();pctx.moveTo(e.offsetX,e.offsetY);});pad.addEventListener('pointermove',e=>{if(!drawing)return;pctx.lineTo(e.offsetX,e.offsetY);pctx.stroke();});window.addEventListener('pointerup',()=>drawing=false);function clearPad(){pctx.clearRect(0,0,pad.width,pad.height);}function saveSig(){const d=pad.toDataURL();const b=document.createElement('canvas');b.width=pad.width;b.height=pad.height;if(d===b.toDataURL()){alert('Draw first');return;}addChip(d,'sig');clearPad();}
document.getElementById('sigFile').addEventListener('change',e=>{const fr=new FileReader();fr.onload=ev=>addChip(ev.target.result,'sig');fr.readAsDataURL(e.target.files[0]);});document.getElementById('stampFile').addEventListener('change',e=>{const fr=new FileReader();fr.onload=ev=>addChip(ev.target.result,'stamp');fr.readAsDataURL(e.target.files[0]);});
function addChip(url,type){const list=document.getElementById(type==='sig'?'sigList':'stampList');const div=document.createElement('div');div.className='sigChip';div.innerHTML=`<img src="${url}">`;div.onclick=()=>{const img=new Image();img.onload=()=>{saveH();objs.push({img,data:url,x:mainCanvas.width/2,y:mainCanvas.height/2,w:160,h:img.height*(160/img.width),scale:1,rotation:0,opacity:1});sel=objs.length-1;render();};img.src=url;};list.prepend(div);}
function makeStamp(shape){const txt=document.getElementById('stampTxt').value||'APPROVED';const c=document.createElement('canvas');c.width=400;c.height=400;const cx=c.getContext('2d');if(shape==='circle'){cx.strokeStyle='#C1272D';cx.lineWidth=8;cx.beginPath();cx.arc(200,200,150,0,Math.PI*2);cx.stroke();cx.fillStyle='#C1272D';cx.font='bold 32px sans-serif';cx.textAlign='center';cx.fillText(txt.toUpperCase(),200,210);}else{cx.strokeStyle='#0A4A8A';cx.lineWidth=6;cx.strokeRect(20,20,360,360);cx.fillStyle='#0A4A8A';cx.font='bold 32px sans-serif';cx.textAlign='center';cx.fillText(txt.toUpperCase(),200,210);}addChip(c.toDataURL(),'stamp');}
mainCanvas.addEventListener('pointerdown',e=>{const rect=mainCanvas.getBoundingClientRect();const x=(e.clientX-rect.left)*(mainCanvas.width/rect.width);const y=(e.clientY-rect.top)*(mainCanvas.height/rect.height);for(let i=objs.length-1;i>=0;i--){const o=objs[i];const dx=x-o.x,dy=y-o.y;const cos=Math.cos(-o.rotation*Math.PI/180),sin=Math.sin(-o.rotation*Math.PI/180);const rx=dx*cos - dy*sin,ry=dx*sin + dy*cos;if(Math.abs(rx)<o.w*o.scale/2+10 && Math.abs(ry)<o.h*o.scale/2+10){sel=i;isDrag=true;dragOff={x:rx,y:ry};saveH();render();return;}}sel=null;render();});
mainCanvas.addEventListener('pointermove',e=>{if(!isDrag||sel===null)return;const rect=mainCanvas.getBoundingClientRect();const x=(e.clientX-rect.left)*(mainCanvas.width/rect.width);const y=(e.clientY-rect.top)*(mainCanvas.height/rect.height);const o=objs[sel];const cos=Math.cos(o.rotation*Math.PI/180),sin=Math.sin(o.rotation*Math.PI/180);o.x=x-(dragOff.x*cos - dragOff.y*sin);o.y=y-(dragOff.x*sin + dragOff.y*cos);render();});
window.addEventListener('pointerup',()=>isDrag=false);
function deleteSel(){if(sel===null)return;saveH();objs.splice(sel,1);sel=null;render();}
function clearAll(){saveH();objs=[];docImg=null;mctx.fillStyle='white';mctx.fillRect(0,0,mainCanvas.width,mainCanvas.height);render();}
function exportPNG(){const a=document.createElement('a');a.download='signed.png';a.href=mainCanvas.toDataURL('image/png');a.click();}
function exportJPG(){const t=document.createElement('canvas');t.width=mainCanvas.width;t.height=mainCanvas.height;const c=t.getContext('2d');c.fillStyle='white';c.fillRect(0,0,t.width,t.height);c.drawImage(mainCanvas,0,0);const a=document.createElement('a');a.download='signed.jpg';a.href=t.toDataURL('image/jpeg',0.95);a.click();}
function exportPDF(){const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:mainCanvas.height>mainCanvas.width?'p':'l',unit:'px',format:[mainCanvas.width,mainCanvas.height]});pdf.addImage(mainCanvas.toDataURL('image/png'),'PNG',0,0,mainCanvas.width,mainCanvas.height);pdf.save('signed.pdf');}
mctx.fillStyle='white';mctx.fillRect(0,0,mainCanvas.width,mainCanvas.height);mctx.fillStyle='#999';mctx.font='14px sans-serif';mctx.textAlign='center';mctx.fillText('Upload or scan document to start',400,560);
</script></body></html>
